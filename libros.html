<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Libros — El Tintero</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="contenedor">
    <h1>El Tintero</h1>
    <nav class="nav-principal">
      <a href="catalogo.html">Catálogo</a>
      <a href="libros.html">Libros</a>
      <a href="clientes.html">Clientes</a>
      <a href="ventas.html">Ventas</a>
      <a href="historial.html">Historial</a>
    </nav>
  </header>
  <main class="contenedor">
    <section>
      <h2>Libros</h2>
      <form id="libros-form" action="#" method="post" novalidate>
        <p class="form-group">
          <label for="libros-titulo">Título</label>
          <input id="libros-titulo" name="titulo" type="text">
        </p>
        <p class="form-group">
          <label for="libros-isbn">ISBN</label>
          <input id="libros-isbn" name="isbn" type="text">
        </p>
        <p class="form-group">
          <label for="libros-precio">Precio</label>
          <input id="libros-precio" name="precio" type="number" min="0" step="0.01">
        </p>
        <p class="form-group">
          <label for="libros-editorial">Editorial</label>
          <select id="libros-editorial" name="editorial"></select>
        </p>
        <p class="form-group">
          <label for="libros-genero">Género</label>
          <select id="libros-genero" name="genero"></select>
        </p>
        <fieldset>
          <legend>Autores</legend>
        </fieldset>
        <p class="form-acciones">
          <button type="submit" class="btn">Registrar libro</button>
        </p>
      </form>
      <div id="libros-vacio" class="mensaje mensaje-vacio" aria-live="polite" hidden></div>
      <div id="libros-mensaje-ok" class="mensaje mensaje-exito" aria-live="polite" hidden></div>
      <div id="libros-mensaje-error" class="mensaje mensaje-error" aria-live="polite" hidden></div>
      <div class="tabla-contenedor">
        <table id="libros-tabla" class="tabla">
          <thead>
            <tr>
              <th scope="col">Título</th>
              <th scope="col">ISBN</th>
              <th scope="col">Editorial</th>
              <th scope="col">Género</th>
              <th scope="col">Autores</th>
              <th scope="col">Precio</th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
    </section>
  </main>
  <footer class="contenedor">
    <p>El Tintero — Datos de ejemplo para el Primer Parcial de ProgIII.</p>
  </footer>
  <script defer src="js/data.js"></script>
  <script defer src="js/altas.js"></script>
</body>
</html>
